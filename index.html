<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建设中</title>
<meta name="description" content="站点正在建设中，敬请期待。">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f6f7f9;
    color: #1d2129;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(680px 380px at 50% -8%, rgba(45, 110, 245, .10), transparent 70%),
      radial-gradient(520px 320px at 85% 108%, rgba(120, 90, 240, .08), transparent 70%);
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border: 1px solid #e8eaee;
    border-radius: 18px;
    padding: 52px 40px 44px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -12px rgba(16, 24, 40, .10);
    animation: rise .6s cubic-bezier(.22, .8, .3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    margin-bottom: 26px;
    border-radius: 16px;
    background: #eef3fe;
    color: #2d6ef5;
  }
  .dot svg { width: 26px; height: 26px; }
  h1 {
    margin: 0 0 12px;
    font-size: 25px;
    font-weight: 650;
    letter-spacing: .3px;
  }
  p {
    margin: 0 auto;
    max-width: 380px;
    font-size: 15px;
    line-height: 1.75;
    color: #5b6472;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 30px;
    padding: 7px 14px;
    border: 1px solid #e8eaee;
    border-radius: 999px;
    background: #fafbfc;
    font-size: 13px;
    color: #5b6472;
  }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, .55);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    70%  { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
    100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }
  footer {
    margin-top: 34px;
    padding-top: 22px;
    border-top: 1px solid #f0f2f5;
    font-size: 12.5px;
    color: #98a1ae;
  }
  footer a {
    color: #5b6472;
    text-decoration: none;
    border-bottom: 1px solid #dfe3e9;
    padding-bottom: 1px;
    transition: color .2s, border-color .2s;
  }
  footer a:hover { color: #2d6ef5; border-color: #2d6ef5; }
  @media (max-width: 480px) {
    .card { padding: 40px 24px 34px; border-radius: 16px; }
    h1 { font-size: 22px; }
    p { font-size: 14.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .pulse { animation: none; }
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <div class="dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v18M3 12h18"/>
        <circle cx="12" cy="12" r="9" opacity=".45"/>
      </svg>
    </div>

    <h1>网站建设中</h1>
    <p>这里正在搭建中，内容稍后上线。<br>页面已经部署完成，随时可以访问。</p>

    <div class="status">
      <span class="pulse" aria-hidden="true"></span>
      <span>页面已上线 · 持续更新中</span>
    </div>

    <footer>
      由 GitHub Pages 提供托管 ·
      <a href="https://github.com/mikexinhuanxi">@mikexinhuanxi</a>
    </footer>
  </main>
</body>
</html>
